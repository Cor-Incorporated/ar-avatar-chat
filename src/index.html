<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
    <title>Cor.Inc AR Demo</title>
    <link rel="stylesheet" href="./styles/bottom-sheet.css">
    <style>
      :root { color-scheme: dark; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      #ar-stage, #ar-canvas, #arjs-video {
        position: fixed !important;
        inset: 0 !important;
        width: var(--ar-layout-width, 100vw) !important;
        height: var(--ar-layout-height, 100vh) !important;
        margin: 0 !important;
      }
      /* ARToolkitSource appends video after the existing stage. The stage must
         own a higher stacking context or its child canvas stays behind video. */
      #ar-stage { z-index: 1; overflow: hidden; pointer-events: none; }
      #arjs-video { z-index: 0 !important; object-fit: cover !important; }
      #ar-canvas { z-index: 1; background: transparent; }
      #ar-stage {
        transform: translate3d(var(--ar-vv-offset-x, 0px), var(--ar-vv-offset-y, 0px), 0);
      }
      #info {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        z-index: 2;
        max-width: min(80vw, 360px);
        padding: 8px 12px;
        border-radius: 8px;
        color: white;
        background: rgb(0 0 0 / 70%);
        font: 14px/1.4 system-ui, sans-serif;
        transition: opacity 180ms ease;
      }
      #info h3, #info p { margin: 2px 0; }
      #info.hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #info { transition: none; } }
    </style>
  </head>
  <body>
    <main id="ar-stage" aria-label="ARカメラ表示">
      <canvas id="ar-canvas"></canvas>
    </main>
    <aside id="info" aria-live="polite">
      <h3>🐧 Cor.Inc AR Demo</h3>
      <p>📸 名刺のペンギンロゴにカメラを向けてください</p>
      <p id="status">⏳ 初期化中...</p>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
